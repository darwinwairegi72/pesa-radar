name: Collect new data

on:
  schedule:
    - cron: "30 12 * * 4"
    - cron: "30 14 * * 4"
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Collect
        run: python -m pipeline.run

      - name: Save new drafts
        run: |
          git config user.name "pesa-radar-bot"
          git config user.email "pesa-radar-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "New drafts to review" && git push)

      - name: Ask a person to review
        if: hashFiles('out/summary.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Review needed: new drafts" --body-file out/summary.md
